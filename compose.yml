services:
  sap-lens:
    build:
      context: .
      args:
        SAP_LENS_SOURCE_SHA: ${SAP_LENS_SOURCE_SHA:?Set the source commit with git rev-parse HEAD}
    image: sap-lens:2-local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${SAP_LENS_PUBLISH_PORT:-18795}:18795"
    environment:
      SAP_LENS_V2_DATA_DIR: /data
      SAP_LENS_V2_PORT: "18795"
      SAP_LENS_V2_AUTH: accounts
      SAP_LENS_V2_CERT: /run/tls/server.crt
      SAP_LENS_V2_CERT_KEY: /run/tls/server.key
      SAP_LENS_V2_ALLOWED_HOSTS: ${SAP_LENS_V2_ALLOWED_HOSTS:?Set the certificate host names}
      SAP_LENS_V2_TRUSTED_PROXIES: ${SAP_LENS_V2_TRUSTED_PROXIES:-}
      SAP_LENS_V2_TRUSTED_PROXY_HOPS: ${SAP_LENS_V2_TRUSTED_PROXY_HOPS:-1}
    volumes:
      - sap-lens-data:/data
      - type: bind
        source: ${SAP_LENS_TLS_DIRECTORY:?Select the private TLS directory}
        target: /run/tls
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 25s
volumes:
  sap-lens-data:
