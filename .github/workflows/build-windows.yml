name: Build Windows application
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - name: Build and test
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Smoke test packaged application
        shell: pwsh
        run: ./scripts/test-windows-exe.ps1
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-build-diagnostics
          path: |
            backend/build/SAP-Lens/warn-SAP-Lens.txt
            ${{ runner.temp }}/sap-lens-smoke/**/*.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SAP-Lens-Windows-x64
          path: |
            backend/dist/SAP-Lens.exe
            backend/dist/SAP-Lens.exe.sha256
          if-no-files-found: error
          retention-days: 14
