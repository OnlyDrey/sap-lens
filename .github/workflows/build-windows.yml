name: Build Windows application
on:
  workflow_dispatch:
  push:
    branches: [main, work]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - name: Build and test
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Smoke test packaged application
        shell: pwsh
        run: ./scripts/test-windows-exe.ps1
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Windows-build-diagnostics
          path: |
            backend/build/SAP-Lens/warn-SAP-Lens.txt
            ${{ runner.temp }}/sap-lens-smoke/**/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash backend/dist/SAP-Lens.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SAP-Lens.exe" | Set-Content backend/dist/SAP-Lens.exe.sha256 -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SAP-Lens-Windows-x64
          path: |
            backend/dist/SAP-Lens.exe
            backend/dist/SAP-Lens.exe.sha256
          if-no-files-found: error
          retention-days: 14
