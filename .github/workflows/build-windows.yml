name: Build Windows Application
on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Build only, beta prerelease, or stable release
        type: choice
        options: [build, beta, stable]
        default: build
        required: true
      version:
        description: Base MAJOR.MINOR.PATCH embedded in this build and release
        type: string
        default: '0.1.0'
        required: true
      benchmark_packaging:
        description: Compare clean and same-job incremental PyInstaller packaging
        type: boolean
        default: false
      cold_cache:
        description: Benchmark without restoring or saving dependency/browser caches
        type: boolean
        default: false
permissions:
  contents: read
  actions: read # Read this run's step durations for the timing summary.
concurrency:
  group: sap-lens-windows-distribution
  cancel-in-progress: false
jobs:
  reserve-version:
    name: Reserve Release Version
    if: ${{ inputs.release_mode != 'build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    environment:
      name: ${{ inputs.release_mode == 'stable' && 'sap-lens-stable' || 'sap-lens-beta' }}
    outputs:
      metadata: ${{ steps.allocate.outputs.metadata }}
    steps:
      - name: Check out the source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up version allocation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Atomically reserve the final release version before building
        id: allocate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/release-windows.py allocate
  windows-exe:
    name: Windows Build & Verification
    needs: reserve-version
    if: ${{ !cancelled() && (needs.reserve-version.result == 'success' || (inputs.release_mode == 'build' && needs.reserve-version.result == 'skipped')) }}
    env:
      RELEASE_MODE: ${{ inputs.release_mode }}
      RELEASE_VERSION: ${{ inputs.version }}
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      metadata: ${{ steps.build_identity.outputs.metadata }}
      artifact_id: ${{ steps.executable.outputs.artifact-id }}
      artifact_digest: ${{ steps.executable.outputs.artifact-digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node and npm download cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false # Cache behavior is explicit, including cold benchmarks.
          cache: ${{ !inputs.cold_cache && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Python and pip download cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: ${{ !inputs.cold_cache && 'pip' || '' }}
          cache-dependency-path: |
            backend/requirements*.txt
            scripts/requirements-audit.txt
      - name: Validate manual version and release policy
        shell: pwsh
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/release-windows.py validate-inputs
      - name: Generate the immutable build identity
        id: build_identity
        shell: pwsh
        env:
          RELEASE_ALLOCATION_JSON: ${{ needs.reserve-version.outputs.metadata }}
        run: python scripts/release-windows.py prepare-build
      - name: Configure cold-cache benchmark locations
        shell: pwsh
        env:
          COLD_CACHE: ${{ inputs.cold_cache }}
        run: |
          if ($env:COLD_CACHE -eq 'true') {
            # Use empty job-local directories instead of any runner-image download cache.
            "npm_config_cache=$env:RUNNER_TEMP/sap-lens-cold-npm" | Add-Content $env:GITHUB_ENV
            "PIP_CACHE_DIR=$env:RUNNER_TEMP/sap-lens-cold-pip" | Add-Content $env:GITHUB_ENV
          }
      - name: Create isolated Python build environment
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Environment
      - name: Install dependencies and build production frontend
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Frontend
      - name: Install Python build and test dependencies
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Python
      - name: Audit Windows Python dependencies
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Audit
      - name: Audit production JavaScript dependencies
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage JavaScriptAudit
      - name: Package Windows executable
        shell: pwsh
        env:
          BENCHMARK_PACKAGING: ${{ inputs.benchmark_packaging }}
        run: ./scripts/build-windows.ps1 -Stage Package -BenchmarkPackaging:([bool]::Parse($env:BENCHMARK_PACKAGING))
      - name: Verify Windows PE, resources, privacy and checksum
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Verify
      - name: Run Windows application smoke tests
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Smoke
      - name: Upload verified executable
        id: executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SAP-Lens-Windows-x64
          path: |
            backend/dist/SAP-Lens.exe
            backend/dist/SAP-Lens.exe.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0 # The one-file EXE already contains a compressed archive.
      - name: Download this run's verified artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.executable.outputs.artifact-id }}
          path: ${{ runner.temp }}/sap-lens-artifact-download
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: Verify distributed artifact
        shell: pwsh
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/sap-lens-distribution
          ARTIFACT_DOWNLOAD_DIRECTORY: ${{ runner.temp }}/sap-lens-artifact-download
          ARTIFACT_DIGEST: ${{ steps.executable.outputs.artifact-digest }}
        run: ./scripts/build-windows.ps1 -Stage Artifact -ArtifactDirectory $env:ARTIFACT_DIRECTORY -ArtifactDownloadDirectory $env:ARTIFACT_DOWNLOAD_DIRECTORY -ArtifactDigest $env:ARTIFACT_DIGEST
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-build-diagnostics
          path: |
            backend/build/timings.jsonl
            backend/build/SAP-Lens/warn-SAP-Lens.txt
            ${{ runner.temp }}/sap-lens-smoke/**/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: SAP Lens Windows Build Report
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
          BUILD_JOB_NAME: Windows Build & Verification
          ARTIFACT_ID: ${{ steps.executable.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.executable.outputs.artifact-digest }}
          ARTIFACT_NAME: SAP-Lens-Windows-x64
        run: |
          if (Test-Path scripts/write-build-report.py) {
            python scripts/write-build-report.py
            if ($LASTEXITCODE -ne 0) { Write-Host '::warning::Build report unavailable; inspect stage logs.' }
          } else {
            Write-Host '::warning::Build report unavailable because checkout did not complete.'
          }
          exit 0
  publish-release:
    name: Publish Verified Windows Release
    needs: windows-exe
    if: ${{ needs.windows-exe.result == 'success' && inputs.release_mode != 'build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    # Referencing an Environment does not configure approval rules; see docs/deployment/RELEASES.md.
    environment:
      name: ${{ inputs.release_mode == 'stable' && 'sap-lens-stable' || 'sap-lens-beta' }}
    steps:
      - name: Check out the exact built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up publication Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Download this build artifact without extraction
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.windows-exe.outputs.artifact_id }}
          path: ${{ runner.temp }}/sap-lens-release-download
          skip-decompress: true
          merge-multiple: true
          digest-mismatch: error
      - name: Publish assets with the exact embedded version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_VERSION_JSON: ${{ needs.windows-exe.outputs.metadata }}
          ARTIFACT_ID: ${{ needs.windows-exe.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.windows-exe.outputs.artifact_digest }}
          RELEASE_DOWNLOAD: ${{ runner.temp }}/sap-lens-release-download
          RELEASE_OUTPUT: ${{ runner.temp }}/sap-lens-release-assets
        run: python scripts/release-windows.py publish --download "$RELEASE_DOWNLOAD" --output "$RELEASE_OUTPUT"
