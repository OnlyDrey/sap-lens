name: Build Windows application
on:
  workflow_dispatch:
    inputs:
      benchmark_packaging:
        description: Compare clean and same-job incremental PyInstaller packaging
        type: boolean
        default: false
      cold_cache:
        description: Benchmark without restoring or saving dependency/browser caches
        type: boolean
        default: false
permissions:
  contents: read
  actions: read # Read this run's step durations for the timing summary.
jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false # Cache behavior is explicit, including cold benchmarks.
          cache: ${{ !inputs.cold_cache && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: ${{ !inputs.cold_cache && 'pip' || '' }}
          cache-dependency-path: |
            backend/requirements*.txt
            scripts/requirements-audit.txt
      - name: Configure browser cache location
        shell: pwsh
        env:
          COLD_CACHE: ${{ inputs.cold_cache }}
        run: |
          "PLAYWRIGHT_BROWSERS_PATH=$env:RUNNER_TEMP/sap-lens-playwright" | Add-Content $env:GITHUB_ENV
          if ($env:COLD_CACHE -eq 'true') {
            # Use empty job-local directories instead of any runner-image download cache.
            "npm_config_cache=$env:RUNNER_TEMP/sap-lens-cold-npm" | Add-Content $env:GITHUB_ENV
            "PIP_CACHE_DIR=$env:RUNNER_TEMP/sap-lens-cold-pip" | Add-Content $env:GITHUB_ENV
          }
      - name: Cache pinned Playwright headless browser
        if: ${{ !inputs.cold_cache }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/sap-lens-playwright
          # Exact lockfile includes Playwright version and its browser revision. No fallback keys.
          key: playwright-headless-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Environment
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Environment
      - name: Frontend
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Frontend
      - name: Python
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Python
      - name: Audit
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Audit
      - name: Backend
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Backend
      - name: Browser
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Browser
      - name: Package
        shell: pwsh
        env:
          BENCHMARK_PACKAGING: ${{ inputs.benchmark_packaging }}
        run: ./scripts/build-windows.ps1 -Stage Package -BenchmarkPackaging:([bool]::Parse($env:BENCHMARK_PACKAGING))
      - name: Verify
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Verify
      - name: Smoke
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Smoke
      - name: Upload verified executable
        id: executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SAP-Lens-Windows-x64
          path: |
            backend/dist/SAP-Lens.exe
            backend/dist/SAP-Lens.exe.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0 # The one-file EXE already contains a compressed archive.
      - name: Download this run's verified artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.executable.outputs.artifact-id }}
          path: ${{ runner.temp }}/sap-lens-distribution
          merge-multiple: true
      - name: Verify distributed artifact
        shell: pwsh
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/sap-lens-distribution
        run: ./scripts/build-windows.ps1 -Stage Artifact -ArtifactDirectory $env:ARTIFACT_DIRECTORY
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-build-diagnostics
          path: |
            backend/build/timings.jsonl
            backend/build/SAP-Lens/warn-SAP-Lens.txt
            ${{ runner.temp }}/sap-lens-smoke/**/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: SAP Lens Windows Build Report
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.executable.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.executable.outputs.artifact-digest }}
          ARTIFACT_NAME: SAP-Lens-Windows-x64
        run: |
          if (Test-Path scripts/write-build-report.py) {
            python scripts/write-build-report.py
            if ($LASTEXITCODE -ne 0) { Write-Host '::warning::Build report unavailable; inspect stage logs.' }
          } else {
            Write-Host '::warning::Build report unavailable because checkout did not complete.'
          }
          exit 0
