name: Build Windows application
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read # Read this run's step durations for the timing summary.
jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            scripts/requirements-audit.txt
      - name: Configure browser cache location
        shell: pwsh
        run: '"PLAYWRIGHT_BROWSERS_PATH=$env:RUNNER_TEMP/sap-lens-playwright" | Add-Content $env:GITHUB_ENV'
      - name: Cache pinned Playwright headless browser
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/sap-lens-playwright
          # Exact lockfile includes Playwright version and its browser revision. No fallback keys.
          key: playwright-headless-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Environment
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Environment
      - name: Frontend
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Frontend
      - name: Python
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Python
      - name: Audit
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Audit
      - name: Backend
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Backend
      - name: Browser
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Browser
      - name: Package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Package
      - name: Verify
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Verify
      - name: Smoke
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Stage Smoke
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-build-diagnostics
          path: |
            backend/build/timings.jsonl
            backend/build/SAP-Lens/warn-SAP-Lens.txt
            ${{ runner.temp }}/sap-lens-smoke/**/*.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SAP-Lens-Windows-x64
          path: |
            backend/dist/SAP-Lens.exe
            backend/dist/SAP-Lens.exe.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0 # The one-file EXE already contains a compressed archive.
      - name: Summarize workflow timings
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read workflow timings.' }
          "`n### Workflow steps (includes setup, caches and artifact upload)`n| Step | Seconds | Result |`n|---|---:|---|" | Add-Content $env:GITHUB_STEP_SUMMARY
          foreach ($job in $jobs.jobs) {
            foreach ($step in $job.steps) {
              if ($step.completed_at -and $step.started_at) {
                $seconds = ([datetime]$step.completed_at - [datetime]$step.started_at).TotalSeconds
                "| $($step.name) | $seconds | $($step.conclusion) |" | Add-Content $env:GITHUB_STEP_SUMMARY
              }
            }
          }
