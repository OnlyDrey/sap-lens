name: AuthLens Validation
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: node scripts/product-version.mjs
      - run: node --test scripts/tests/*.test.mjs
      - run: python3 -m pip install -r scripts/requirements-checks.txt
      - run: python3 scripts/check-workflows.py
      - run: python3 scripts/check-structure.py
      - run: python3 -m unittest discover -s scripts/tests -p "test_*.py"
      - run: python3 scripts/check-docs.py
      - run: python3 scripts/check-secrets.py
      - run: npm --prefix frontend run check:types
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run test:unit
      - run: node scripts/sync-lucide-catalog.mjs --check
      - run: npm --prefix frontend audit --omit=dev
      - run: npm --prefix frontend run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
  backend:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend-dist
          path: frontend/dist
      - run: dotnet restore backend/AuthLens.slnx
      - run: dotnet build backend/AuthLens.slnx -c Release --no-restore
      - run: dotnet test backend/tests/AuthLens.Tests -c Release --no-build --filter "Category!=Publish" --logger trx
      - run: python scripts/check-dependencies.py
      - shell: pwsh
        run: ./backend/scripts/check-powershell.ps1
      - shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
      - shell: pwsh
        run: Invoke-Pester -Path backend/scripts/tests -CI
      - if: runner.os == 'Linux'
        run: bash backend/scripts/tests/deploy-windows.test.sh
  browser:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend-dist
          path: frontend/dist
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: npm --prefix frontend run test:browser -- tests/dotnet-host.spec.ts tests/component-library.spec.ts --workers=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results
          retention-days: 7
