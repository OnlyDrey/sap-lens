name: Fast Validation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  # Push and PR status checks cannot cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: Backend & Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node and npm download cache
        id: setup_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Python and pip download cache
        id: setup_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            scripts/requirements-audit.txt
      - name: Install backend test dependencies
        id: dependencies
        run: python scripts/ci.py run dependencies -- python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
      - name: Check Python dependencies
        id: pip_check
        run: python scripts/ci.py run pip_check -- python -m pip check
      - name: Validate workflow schemas, expressions and shell commands
        id: workflow_lint
        run: python scripts/ci.py run workflow_lint -- python scripts/ci.py lint
      - name: Run backend and repository regressions with deprecations as errors
        id: backend
        run: python scripts/ci.py run backend -- python -W error::DeprecationWarning -m unittest discover -s backend/tests -v
      - name: Install frontend dependencies
        id: npm_install
        run: python scripts/ci.py run npm_install -- npm --prefix frontend ci --no-audit --no-fund
      - name: Run frontend type checks
        id: types
        run: python scripts/ci.py run types -- npm --prefix frontend run check:types
      - name: Write validation summary
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_REQUIRED: checkout setup_node setup_python dependencies pip_check workflow_lint backend npm_install types
          CI_JOB_NAME: ${{ github.job }}
        run: |
          if [ -f scripts/ci.py ]; then
            python scripts/ci.py summary
          else
            echo 'Validation incomplete: source checkout failed.' >> "$GITHUB_STEP_SUMMARY"
          fi
